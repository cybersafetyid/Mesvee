name: Release

# Triggered by the `v*` tag that `pnpm run bump:*` pushes. Builds signed installers
# plus updater artifacts for macOS (Apple Silicon + Intel), Windows and Linux,
# attaches them — and the `latest.json` the in-app updater polls — to a GitHub
# Release whose notes come from CHANGELOG.md, then publishes it.
#
# The updater endpoint in src-tauri/tauri.conf.json is
#   https://github.com/cybersafetyid/Mesvee/releases/latest/download/latest.json
# so the release is created as a draft and only published after every platform
# uploaded successfully: users never see a half-built update.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The updater only installs strictly newer versions, so a tag that
      # disagrees with the manifests would publish an update nobody can install.
      - name: Verify tag matches manifests
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          TAURI=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$VERSION" != "$PKG" ] || [ "$VERSION" != "$TAURI" ]; then
            echo "::error::tag $GITHUB_REF_NAME, package.json $PKG, tauri.conf.json $TAURI must match"
            exit 1
          fi

      - name: Create draft release from CHANGELOG
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.mjs "$VERSION" > notes.md
          PRERELEASE=false
          case "$VERSION" in *-*) PRERELEASE=true ;; esac
          # Create through the API so the id comes straight from the response:
          # draft releases are "untagged" and cannot be looked up by tag.
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" -f name="Mesvee $VERSION" \
            -F body=@notes.md -F draft=true -F prerelease=$PRERELEASE --jq .id)
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"

  build:
    name: build · ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            rust_targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            rust_targets: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            rust_targets: ''
            args: ''
          - name: Windows
            os: windows-latest
            rust_targets: ''
            args: ''
    steps:
      - uses: actions/checkout@v4

      # Version comes from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.args }}

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev build-essential curl wget file

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # tauri-action builds, signs the updater artifacts with the minisign key,
      # uploads everything to the draft release and merges this platform's entry
      # into latest.json (keys like darwin-aarch64, windows-x86_64, linux-x86_64).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          projectPath: .
          args: ${{ matrix.args }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

  publish:
    name: publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.prepare.outputs.release_id }}" \
            -F draft=false -F make_latest=true
